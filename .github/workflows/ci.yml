name: Verify Homeward
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run eval
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: homeward-evaluation
          path: .local/evaluation.json
